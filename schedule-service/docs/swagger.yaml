basePath: /
definitions:
  handlers.HealthResponse:
    properties:
      services:
        additionalProperties:
          $ref: '#/definitions/handlers.ServiceInfo'
        type: object
      status:
        type: string
      timestamp:
        type: string
    type: object
  handlers.ServiceInfo:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
  models.PlanningResult:
    properties:
      reason:
        type: string
      scheduled_label:
        type: string
      scheduled_time:
        type: string
      score:
        type: integer
      status:
        type: string
      threshold:
        type: integer
      triggered:
        type: boolean
      zone_id:
        type: integer
      zone_name:
        type: string
    type: object
  models.SimulateIncidentRequest:
    properties:
      lat:
        description: Centro de URBANO_CENTRAL
        example: -0.935
        type: number
      lon:
        description: Centro de URBANO_CENTRAL
        example: -78.6175
        type: number
      type:
        example: SENSOR_LLENO
        type: string
    required:
    - lat
    - lon
    - type
    type: object
host: localhost:8083
info:
  contact:
    email: soporte@latacunga.gob.ec
    name: API Support
  description: API de planificación para recolección de residuos de Latacunga. Geolocaliza
    incidentes, acumula puntaje y dispara eventos de recolección.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://latacunga.gob.ec/terms/
  title: Schedule Service - Planning Core API
  version: "1.0"
paths:
  /api/v1/planning/config/thresholds:
    put:
      consumes:
      - application/json
      description: Permite configurar dinámicamente los umbrales que activan la recolección
        automática
      parameters:
      - description: 'Mapa de zona a umbral (ej: {\'
        in: body
        name: body
        required: true
        schema:
          additionalProperties:
            type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Cantidad de umbrales actualizados
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: JSON inválido o umbral negativo
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Actualiza umbrales de disparo por zona
      tags:
      - Planning
  /api/v1/planning/simulate:
    post:
      consumes:
      - application/json
      description: Inyecta un incidente falso con coordenadas para verificar detección
        de zona y acumulación de puntaje
      parameters:
      - description: Datos del incidente simulado
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.SimulateIncidentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Umbral superado, recolección activada automáticamente
          schema:
            $ref: '#/definitions/models.PlanningResult'
        "202":
          description: Incidente procesado, zona detectada, puntaje acumulado (umbral
            no superado)
          schema:
            $ref: '#/definitions/models.PlanningResult'
        "400":
          description: Coordenadas inválidas o zona no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Simula un incidente para debugging
      tags:
      - Planning
  /api/v1/planning/zones:
    get:
      description: Obtiene todas las zonas macro de planificación con su geometría
        y configuración de horario
      produces:
      - application/json
      responses:
        "200":
          description: Lista de zonas
          schema:
            items:
              type: object
            type: array
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Lista todas las zonas de recolección
      tags:
      - Planning
  /api/v1/planning/zones/{id}/metrics:
    get:
      description: Retorna el puntaje actual y umbral configurado para una zona específica
      parameters:
      - description: ID de la zona
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Métricas de la zona
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Zona o métricas no encontradas
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtiene métricas de acumulación de una zona
      tags:
      - Planning
  /api/v1/planning/zones/{id}/trigger:
    post:
      consumes:
      - application/json
      description: Fuerza un trigger de recolección ignorando el puntaje acumulado,
        útil para emergencias
      parameters:
      - description: ID de la zona
        in: path
        name: id
        required: true
        type: integer
      - description: 'Razón del trigger manual (ej: {\'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Resultado del trigger
          schema:
            type: object
        "400":
          description: JSON inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Dispara manualmente la recolección para una zona
      tags:
      - Planning
  /health:
    get:
      description: Verifica la salud de RabbitMQ y otros componentes del sistema
      produces:
      - application/json
      responses:
        "200":
          description: Todos los servicios están saludables
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
        "503":
          description: Uno o más servicios no están disponibles
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Verifica la salud de todos los servicios
      tags:
      - Health
  /health/rabbitmq:
    get:
      description: Verifica la conexión y estado de RabbitMQ
      produces:
      - application/json
      responses:
        "200":
          description: RabbitMQ está saludable
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
        "503":
          description: RabbitMQ no está disponible
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Verifica la salud de RabbitMQ
      tags:
      - Health
schemes:
- http
- https
swagger: "2.0"
