version: '3.8'

services:
  # 🗺️ Motor de Rutas - OSRM (Open Source Routing Machine)
  routing-engine:
    image: osrm/osrm-backend
    container_name: latacunga_routing
    restart: always
    ports:
      - "5000:5000"
    volumes:
      # Mapea la carpeta local osrm-data al contenedor
      - ./osrm-data:/data
    # Usa el algoritmo MLD (Multi-Level Dijkstra) para rutas rápidas
    command: "osrm-routed --algorithm mld /data/ecuador-latest.osrm"
    networks:
      - latacunga-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/trip/v1/driving/-78.614,-0.933;-78.612,-0.935?source=first"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 🗄️ Base de Datos PostgreSQL + PostGIS (si necesitas local)
