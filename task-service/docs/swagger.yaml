definitions:
  models.Task:
    properties:
      actor_id:
        type: string
      completed_at:
        type: string
      created_at:
        type: string
      id:
        type: string
      instructions:
        type: string
      priority:
        type: integer
      report_id:
        type: string
      started_at:
        type: string
      state:
        type: string
      type:
        description: RECOLECCION, LIMPIEZA
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
info:
  contact: {}
paths:
  /tasks/{reportId}/claim:
    post:
      consumes:
      - application/json
      description: Claim an available task for a specific report
      parameters:
      - description: Report ID
        in: path
        name: reportId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Task'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Claim a task
      tags:
      - tasks
  /tasks/{taskId}/complete:
    put:
      consumes:
      - application/json
      description: Mark a claimed task as completed with photo evidence
      parameters:
      - description: Task ID
        in: path
        name: taskId
        required: true
        type: string
      - description: Photo URL
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Task'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Complete a task
      tags:
      - tasks
  /tasks/available:
    get:
      consumes:
      - application/json
      description: Get list of verified reports available for claiming by workers
      parameters:
      - description: Actor type (WORKER)
        in: query
        name: actorType
        required: true
        type: string
      - description: Latitude
        in: query
        name: lat
        required: true
        type: number
      - description: Longitude
        in: query
        name: lng
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get available tasks for worker
      tags:
      - tasks
swagger: "2.0"
