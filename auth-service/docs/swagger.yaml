definitions:
  handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handlers.OTPRequest:
    properties:
      phone:
        type: string
    required:
    - phone
    type: object
  handlers.OTPVerifyRequest:
    properties:
      code:
        type: string
      phone:
        type: string
    required:
    - code
    - phone
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      role:
        enum:
        - user
        - operador
        - admin
        type: string
    required:
    - email
    - password
    - role
    type: object
  models.OperatorResponse:
    properties:
      active:
        type: boolean
      can_drive_compactor:
        type: boolean
      can_drive_lateral:
        type: boolean
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      license_id:
        type: string
      preferred_zone_id:
        type: integer
      role:
        type: string
      username:
        type: string
    type: object
  models.RegisterOperatorRequest:
    properties:
      can_drive_compactor:
        type: boolean
      can_drive_lateral:
        type: boolean
      email:
        type: string
      full_name:
        minLength: 2
        type: string
      license_id:
        type: string
      password:
        minLength: 8
        type: string
      preferred_zone_id:
        type: integer
      role:
        enum:
        - operador
        - despachador
        - admin
        type: string
      username:
        minLength: 3
        type: string
    required:
    - full_name
    - license_id
    - password
    - role
    - username
    type: object
  models.User:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
      phone:
        type: string
      role:
        type: string
      status:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/admin/users:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all users in the system. Requires admin role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all users
      tags:
      - Users
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password, return access and refresh
        tokens
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - auth
  /api/v1/auth/operators:
    post:
      consumes:
      - application/json
      description: Create a new operator account with full profile including license,
        zone preference, and vehicle capabilities
      parameters:
      - description: Operator registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RegisterOperatorRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.OperatorResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new operator
      tags:
      - auth
  /api/v1/auth/otp/send:
    post:
      consumes:
      - application/json
      description: Request OTP code for phone authentication (citizens only)
      parameters:
      - description: OTP request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.OTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request OTP
      tags:
      - otp
  /api/v1/auth/otp/verify:
    post:
      consumes:
      - application/json
      description: Verify OTP code and authenticate/create user
      parameters:
      - description: OTP verify request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.OTPVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify OTP
      tags:
      - otp
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with email, password and role (only operador/admin
        allowed)
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user (operador/admin only)
      tags:
      - auth
swagger: "2.0"
